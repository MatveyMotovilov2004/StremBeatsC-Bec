syntax = "proto3";

option csharp_namespace = "ArtistGrpc";

package music_business;	

service ArtistGrpcService{
	rpc CreateArtist (CreateArtistRequest) returns (CreateArtistRespounse);
}

message CreateArtistRequest{
	int32 user_id = 1;
	string stage_name = 2;
}
message CreateArtistRespounse{
	int32 artist_id = 1;
}