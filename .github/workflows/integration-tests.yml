name: Integration Tests

on:
  push:
    branches:
      - main-demo
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested  
jobs:
  integration-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run integration tests
        env:
          ENV_FILE: /home/vboxuser/StremBeatsC-Bec/.env
        run: ./test.sh
